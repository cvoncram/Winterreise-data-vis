# Winterreise Performance Visualization: backend and frontend.
#
#   docker compose up --build     build and start
#   docker compose down           stop
#
# The application runs at http://localhost:3000.

services:
  backend:
    build: ./backend
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:-2827092}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-108972344}
      # Mounted secret, read-only.
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
    secrets:
      - github_private_key
    ports:
      # Loopback only, for http://127.0.0.1:8000/docs.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Health check via Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # Backend service on the internal network.
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        # Starts once the backend is healthy.
        condition: service_healthy
    restart: unless-stopped

secrets:
  github_private_key:
    # Private key of the GitHub App on the host; overridable via GITHUB_PRIVATE_KEY_FILE.
    file: ${GITHUB_PRIVATE_KEY_FILE:-./backend/winterreise-database-test.2026-02-09.private-key.pem}
